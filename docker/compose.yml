# Drop this file into an empty folder, put your Claude token in a .env
# file beside it (CLAUDE_CODE_OAUTH_TOKEN=..., get one with
# `claude setup-token`), then run: docker compose up -d
# Open http://localhost:8790 on the same machine. From other devices the
# browser needs HTTPS for the mic: put a reverse proxy in front and set
# BACKEND_WS (see .env.example).
services:
  jarvis:
    image: ghcr.io/blank-query/network-fullstack-agent:latest
    container_name: jarvis
    env_file:
      - path: .env
        required: false
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?put CLAUDE_CODE_OAUTH_TOKEN in .env (claude setup-token)}
    ports:
      - "8790:8790"   # the face
      - "8792:8792"   # the voice bridge
    volumes:
      - agent:/home/jarvis/projects/Jarvis   # CLAUDE.md and memory
      - claude:/home/jarvis/.claude          # Claude Code sessions
      - signals:/data/signals                # voice/face bus, saved session id
      - models:/data/models                  # the downloaded Piper voice
      - logs:/opt/jarvis/backtalk/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  agent:
  claude:
  signals:
  models:
  logs:
